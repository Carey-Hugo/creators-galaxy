<style>
  *{box-sizing:border-box}

  .nebula{position:absolute;inset:0;z-index:1;background:conic-gradient(from 238deg at 76% 42%, transparent 0 12%, rgba(22,215,255,.22) 18%, rgba(255,184,64,.2) 28%, transparent 43%, rgba(68,92,255,.18) 58%, transparent 72%);filter:blur(18px);opacity:.74;mix-blend-mode:screen}

  .planet:after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px solid rgba(119,235,255,.24);transform:rotate(-18deg) scaleX(1.45);filter:blur(.3px)}
  .path{position:absolute;right:313px;bottom:0px;width:230px;height:280px;z-index:2;background:radial-gradient(ellipse at 50% 0,rgba(255,198,81,.75),rgba(255,166,37,.22) 42%,transparent 72%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(4px);opacity:.8}
  .nodes svg{position:absolute;inset:0;z-index:2}.nodes line{stroke:rgba(83,229,255,.23);stroke-width:1}.nodes circle{fill:#93f3ff;filter:drop-shadow(0 0 7px #2fe6ff);opacity:.9}.nodes .gold{fill:#ffd26c;filter:drop-shadow(0 0 9px #ffb93b)}

  .ship .body{position:absolute;left:72px;top:30px;width:184px;height:336px;background:linear-gradient(95deg,rgba(8,23,51,.72),rgba(12,45,89,.84));clip-path:polygon(50% 0,88% 19%,100% 100%,0 100%,12% 19%);border:1px solid rgba(111,232,255,.38)}
  .ship .door{position:absolute;left:112px;top:168px;width:104px;height:142px;border-radius:58px 58px 10px 10px;background:radial-gradient(circle at 50% 35%,#fff8c9,#ffc95f 36%,#ff8a1f 70%);box-shadow:0 0 35px #ffc45a,0 0 95px rgba(255,160,50,.75)}
  .ship .wing-l,.ship .wing-r{position:absolute;bottom:45px;width:112px;height:170px;background:linear-gradient(160deg,rgba(4,16,38,.82),rgba(3,154,194,.28));border:1px solid rgba(99,224,255,.28)}
  .ship .wing-l{left:0;clip-path:polygon(100% 0,100% 100%,0 100%)} .ship .wing-r{right:0;clip-path:polygon(0 0,100% 100%,0 100%)}
  .human{position:absolute;right:410px;bottom:159px;width:36px;height:92px;z-index:4;background:linear-gradient(#fff2b8,#ffb641);clip-path:polygon(42% 0,58% 0,65% 18%,62% 100%,38% 100%,35% 18%);filter:drop-shadow(0 0 14px #ffc55c)}
  .copy{position:absolute;left:96px;top:90px;width:780px;z-index:5}.eyebrow{font-size:34px;letter-spacing:.16em;color:#7febff;text-transform:uppercase;margin-bottom:42px;text-shadow:0 0 18px rgba(66,227,255,.5)}
  h1{margin:0;font-size:86px;line-height:1.08;font-weight:900;letter-spacing:-.03em;text-shadow:0 0 36px rgba(0,0,0,.72),0 0 30px rgba(34,215,255,.22)}
  h1 .gold{color:#ffd577;text-shadow:0 0 25px rgba(255,191,71,.58)}
  .subtitle{margin-top:31px;font-size:38px;line-height:1.32;color:#e9fbff;font-weight:500;text-shadow:0 0 24px rgba(0,0,0,.82)}
  .quote{position:absolute;left:100px;bottom:170px;width:690px;z-index:5;padding-left:28px;border-left:4px solid #ffd16b;font-size:34px;line-height:1.42;color:#cbeef7;text-shadow:0 0 16px rgba(0,0,0,.7)}
  .brand{position:absolute;left:100px;bottom:92px;z-index:5;font-size:26px;color:#fff;letter-spacing:.06em}.brand span{color:#7eeeff}.badge{position:absolute;right:120px;top:72px;z-index:5;border:1px solid rgba(126,238,255,.42);border-radius:999px;padding:13px 22px;font-size:24px;color:#dcfbff;background:rgba(1,15,34,.36);backdrop-filter:blur(10px)}
  .grain{position:absolute;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:5px 5px;opacity:.38;mix-blend-mode:overlay}
  .vignette{position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 72px rgba(2,6,17,.72)}
</style>
